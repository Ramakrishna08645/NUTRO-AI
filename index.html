<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030b08">
  <meta name="description" content="NUTRO AI — Your living intelligence">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>NUTRO AI</title>
  <style>
    :root { color-scheme: dark; --green:#75f0ae; --muted:#a6c6b4; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      min-height:100svh; overflow:hidden; display:grid; place-items:center;
      background: radial-gradient(ellipse at 50% 48%, #0b3322 0%, #06170f 42%, #020806 78%);
      color:#effff5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    main {
      width:min(100%,560px); min-height:100svh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:32px 22px; text-align:center;
    }
    .wordmark { font-size:clamp(25px,6vw,34px); font-weight:750; letter-spacing:.22em; margin:0 0 54px 0; }
    .wordmark span { color:var(--green); }
    .orb-wrap { position:relative; width:min(70vw,330px); aspect-ratio:1; display:grid; place-items:center; margin-bottom:58px; }
    .ring { position:absolute; inset:4%; border:1px solid rgba(117,240,174,.35); border-radius:46% 54% 52% 48%; animation:spin 19s linear infinite; }
    .ring.r2 { inset:11%; border-width:2px; border-color:rgba(117,240,174,.55); transform:rotate(35deg); animation:spinback 25s linear infinite; }
    .ring.r3 { inset:18%; border-color:rgba(117,240,174,.24); animation:spin 14s linear infinite; }
    .orb {
      width:58%; aspect-ratio:1; border-radius:50%;
      background: radial-gradient(circle at 34% 28%, #d2ffe1 0%, #72f5ad 9%, #20b96d 35%, #075b37 67%, #012516 100%);
      box-shadow: 0 0 35px #38df8a88, 0 0 95px #20c87555, inset -18px -22px 35px #001b10aa, inset 8px 8px 25px #d6ffe477;
      animation:breathe 4s ease-in-out infinite;
    }
    .tagline { margin:0; color:var(--muted); font-size:clamp(12px,3vw,15px); letter-spacing:.24em; text-transform:uppercase; }
    @keyframes breathe { 0%,100% { transform:scale(.96); filter:brightness(.92); } 50% { transform:scale(1.04); filter:brightness(1.14); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes spinback { to { transform:rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; } }
  </style>
</head>
<body>
  <main aria-label="NUTRO AI">
    <h1 class="wordmark">NUTRO <span>AI</span></h1>
    <div class="orb-wrap" role="img" aria-label="Glowing emerald NUTRO AI orb">
      <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="orb"></div>
    </div>
    <p class="tagline">Your living intelligence</p>
  </main>
</body>
</html>
